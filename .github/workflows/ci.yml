name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: 语法检查
        run: python -m compileall -q src scripts

      - name: 提交前自检（数据 / 凭据 / 绝对路径 / 学号）
        run: python scripts/preflight.py --all
